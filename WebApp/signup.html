<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Sign up — HTMLStudio</title>
<link rel="stylesheet" href="aurora.css">
<script src="auth.js"></script>
<script>
  // Match whichever light/dark preference was set anywhere else in the
  // app, before first paint, so this page never looks like it "reverted".
  (function () {
    try {
      const t = localStorage.getItem('aurora-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
<nav class="site-nav">
  <a class="brand" href="index.html"><span class="dot"></span>HTMLStudio</a>
  <span class="grow"></span>
  <a class="nav-link" href="login.html">Have an account? <strong>Log in</strong></a>
</nav>

<div class="auth-wrap">
  <div>
    <form class="auth-card" id="signup-form" novalidate>
      <h1>Create your account</h1>
      <p class="sub">Free, instant, no email verification — start building in seconds.</p>

      <label class="field-label" for="name">Name</label>
      <input class="field-input" id="name" autofocus type="text" autocomplete="name" required>

      <label class="field-label" for="email">Email</label>
      <input class="field-input" id="email" type="email" autocomplete="email" required>

      <label class="field-label" for="password">Password <span style="font-weight:400">(8+ characters)</span></label>
      <input class="field-input" id="password" type="password" data-strength autocomplete="new-password" minlength="8" required>

      <div class="auth-msg" id="msg" role="alert"></div>

      <button class="btn btn-primary btn-block" type="submit">Create account</button>
      <p class="auth-alt">
        By signing up you agree your account is stored privately on this device.
      </p>
    </form>
    <p class="demo-note">
      Private by design — your account stays on this device.
    </p>
  </div>
</div>

<script>
(function () {
  if (AuroraAuth.current()) { location.replace('dashboard.html'); return; }

  const form = document.getElementById('signup-form');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'auth-msg';
    try {
      await AuroraAuth.signup({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      location.href = 'dashboard.html';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'auth-msg error';
    }
  });
})();
</script>
</body>
</html>
